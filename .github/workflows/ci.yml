name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Packs the tarball and installs it into a throwaway project. Catches what
      # the unit tests structurally cannot: the published package is several
      # bundles, and two of them disagreeing is invisible when running from source.
      - name: Verify the published package
        run: pnpm verify:package

  sandbox:
    # Hits bKash's real sandbox with their published demo credentials. Allowed to
    # fail: it goes down, and a red cross on someone else's outage is noise.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke
